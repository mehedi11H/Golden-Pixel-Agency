<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - Golden Pixel Agency</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>Golden Pixel Agency</h1>

<p>Admin Order Management</p>

</header>



<section class="order">


<h2>Update Order Status</h2>


<input 
type="text"
id="orderID"
placeholder="Enter Order ID"
>


<select id="status">

<option>Payment Verification Pending</option>
<option>Payment Verified</option>
<option>Processing</option>
<option>Completed</option>
<option>Cancelled</option>

</select>



<button onclick="updateStatus()">
Update Status
</button>


<div id="msg"></div>


</section>



<script type="module">


import { db } from "./firebase-config.js";


import {

collection,
query,
where,
getDocs,
updateDoc

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




window.updateStatus = async function(){



let id = document.getElementById("orderID").value;


let status = document.getElementById("status").value;



let q = query(

collection(db,"orders"),

where("orderID","==",id)

);



let result = await getDocs(q);



if(!result.empty){


result.forEach(async(doc)=>{


await updateDoc(doc.ref,{

status:status

});



document.getElementById("msg").innerHTML=

"<h3>Order Updated Successfully ✅</h3>";



});


}


else{


document.getElementById("msg").innerHTML=

"<h3 style='color:red'>Order ID Not Found ❌</h3>";


}



}


</script>



</body>

</html>
